<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Vendedores — Grantt</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#242835;--border:#2e3348;
  --text:#e4e4e7;--text2:#9ea0ab;--accent:#d4982a;--accent2:#2a8fd4;
  --danger:#d42a2a;--success:#2ad47a;
  --radius:8px;--touch:44px;
}
html{font-family:'Segoe UI',system-ui,sans-serif;font-size:15px;background:var(--bg);color:var(--text)}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;min-height:var(--touch);min-width:var(--touch)}

/* LOGIN */
.login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem;gap:2rem}
.login h1{font-size:1.6rem;letter-spacing:.02em}
.login-sub{color:var(--text2);font-size:.9rem}
.profiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;width:100%;max-width:720px}
.profile-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;text-align:center;transition:border-color .15s,transform .15s}
.profile-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.profile-card .avatar{width:56px;height:56px;border-radius:50%;margin:0 auto .75rem;display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.profile-card .avatar.ger{background:#1e3a5f;color:#5fa8d4}
.profile-card .avatar.ven{background:#1a3d5c;color:var(--accent2)}
.profile-card h3{font-size:1rem;margin-bottom:.25rem}
.profile-card p{color:var(--text2);font-size:.8rem}

/* LAYOUT */
.app{display:none;height:100vh;flex-direction:column}
.app.active{display:flex}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1.5rem;background:var(--surface);border-bottom:1px solid var(--border);gap:1rem;flex-shrink:0}
.topbar h2{font-size:1rem;white-space:nowrap}
.topbar .role-badge{background:var(--accent);color:#000;font-size:.7rem;font-weight:700;padding:.25rem .6rem;border-radius:4px;text-transform:uppercase}
.btn-logout{color:var(--text2);font-size:.85rem;padding:.5rem .75rem;border-radius:var(--radius)}
.btn-logout:hover{background:var(--surface2);color:var(--text)}

.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);padding:.75rem 0;flex-shrink:0;overflow-y:auto}
.sidebar button{display:flex;align-items:center;gap:.6rem;width:100%;padding:.65rem 1.25rem;font-size:.85rem;color:var(--text2);text-align:left;border-radius:0}
.sidebar button:hover{background:var(--surface2);color:var(--text)}
.sidebar button.active{color:var(--accent);background:var(--surface2);border-left:3px solid var(--accent)}

.content{flex:1;padding:1.5rem;overflow-y:auto}
.content h3{font-size:1.15rem;margin-bottom:1rem}

/* TABLES */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:1.5rem}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{background:var(--surface2);text-align:left;padding:.6rem .75rem;font-weight:600;white-space:nowrap;color:var(--text2)}
td{padding:.55rem .75rem;border-top:1px solid var(--border)}
tr:hover td{background:rgba(212,152,42,.04)}

/* CARDS */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem}
.stat .label{font-size:.75rem;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.35rem}
.stat .val{font-size:1.4rem;font-weight:700}

/* STATUS */
.status-pagado{color:var(--success)}
.status-pendiente{color:var(--accent)}
.status-vencido{color:var(--danger)}

/* EMAIL FORM */
.email-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;max-width:500px}
.email-card h4{margin-bottom:.75rem;font-size:.95rem}
.email-card label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:.3rem;margin-top:.75rem}
.email-card input,.email-card textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:.5rem .65rem;color:var(--text)}
.email-card textarea{resize:vertical;min-height:80px}
.btn-send{background:var(--accent);color:#000;font-weight:600;padding:.5rem 1.5rem;border-radius:var(--radius);margin-top:1rem;font-size:.85rem}
.btn-send:hover{filter:brightness(1.1)}

/* FORM NUEVO CLIENTE */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem 1rem;max-width:600px}
.form-grid label{font-size:.8rem;color:var(--text2)}
.form-grid input,.form-grid select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:.5rem .65rem;color:var(--text);min-height:var(--touch)}
.form-grid .full{grid-column:1/-1}
.btn-save{background:var(--accent2);color:#fff;font-weight:600;padding:.5rem 1.5rem;border-radius:var(--radius);margin-top:1rem;font-size:.85rem}
.btn-save:hover{filter:brightness(1.1)}

/* RESPONSIVE */
@media(max-width:700px){
  .sidebar{width:60px;padding:.75rem 0}
  .sidebar button span{display:none}
  .sidebar button{justify-content:center;padding:.65rem}
  .profiles{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:1fr 1fr}
  .form-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="login">
  <h1>APP VENDEDORES</h1>
  <p class="login-sub">Selecciona tu perfil</p>
  <div class="profiles" id="profiles"></div>
</div>

<!-- APP -->
<div class="app" id="app">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:.75rem">
      <h2 id="topTitle">APP VENDEDORES</h2>
      <span class="role-badge" id="roleBadge"></span>
    </div>
    <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
  </div>
  <div class="main">
    <nav class="sidebar" id="sidebar"></nav>
    <div class="content" id="content"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const sbEmbarques = supabase.createClient(
  'https://bmxnqzfoskugnsdkytql.supabase.co',
  'sb_publishable_rqhiObYXtBQWa4VhecKB6A_UAFFDrD0'
);
// ponytail: mock data, replace with Sheets fetch when ready
const PROFILES = [
  { id: 'gerencia', name: 'Gerencia', role: 'gerencia', icon: '👔' },
  { id: 'vend1', name: 'Vendedor 1', role: 'vendedor', icon: '🧑‍💼' },
  { id: 'vend2', name: 'Vendedor 2', role: 'vendedor', icon: '🧑‍💼' },
  { id: 'vend3', name: 'Vendedor 3', role: 'vendedor', icon: '🧑‍💼' },
];

const MOCK = {
  cobranzas: [
    { cliente: 'Aceros del Sur', monto: 4200000, vencimiento: '2026-07-15', estado: 'pendiente' },
    { cliente: 'Minera Patagonia', monto: 8750000, vencimiento: '2026-06-28', estado: 'vencido' },
    { cliente: 'Constructora Valle', monto: 3100000, vencimiento: '2026-07-20', estado: 'pendiente' },
    { cliente: 'Ferretería Central', monto: 1500000, vencimiento: '2026-07-01', estado: 'pagado' },
  ],
  ventas: [
    { vendedor: 'Vendedor 1', ventas: 12500000, costo: 9800000 },
    { vendedor: 'Vendedor 2', ventas: 9800000, costo: 7600000 },
    { vendedor: 'Vendedor 3', ventas: 15200000, costo: 11900000 },
  ],
  cantidades: [
    { producto: 'Tornillos HEX 1/2"', vendido: 4500, stock: 12000 },
    { producto: 'Pletina 3x20mm', vendido: 320, stock: 800 },
    { producto: 'Soldadura E6011', vendido: 150, stock: 400 },
    { producto: 'Disco corte 7"', vendido: 890, stock: 2100 },
  ],
  formasPago: [
    { forma: 'Crédito 30 días', monto: 18200000, pct: 48 },
    { forma: 'Crédito 60 días', monto: 8500000, pct: 22 },
    { forma: 'Contado', monto: 7300000, pct: 19 },
    { forma: 'Cheque', monto: 4100000, pct: 11 },
  ],
  clientes: [
    { nombre: 'Aceros del Sur', rut: '76.123.456-7', vendedor: 'Vendedor 1', ultimaCompra: '2026-07-02' },
    { nombre: 'Minera Patagonia', rut: '76.987.654-3', vendedor: 'Vendedor 2', ultimaCompra: '2026-06-15' },
    { nombre: 'Constructora Valle', rut: '76.555.444-1', vendedor: 'Vendedor 3', ultimaCompra: '2026-07-05' },
    { nombre: 'Ferretería Central', rut: '76.111.222-K', vendedor: 'Vendedor 1', ultimaCompra: '2026-07-01' },
  ],
  stock: [
    { codigo: 'TH-012', producto: 'Tornillos HEX 1/2"', disponible: 12000, reservado: 800, ubicacion: 'A-01' },
    { codigo: 'PL-320', producto: 'Pletina 3x20mm', disponible: 800, reservado: 50, ubicacion: 'B-03' },
    { codigo: 'SE-611', producto: 'Soldadura E6011', disponible: 400, reservado: 30, ubicacion: 'C-02' },
    { codigo: 'DC-700', producto: 'Disco corte 7"', disponible: 2100, reservado: 200, ubicacion: 'A-05' },
  ],
  historial: [
    { cliente: 'Aceros del Sur', fecha: '2026-07-02', total: 2300000, productos: 5, estado: 'entregado' },
    { cliente: 'Aceros del Sur', fecha: '2026-06-18', total: 1900000, productos: 3, estado: 'entregado' },
    { cliente: 'Ferretería Central', fecha: '2026-07-01', total: 1500000, productos: 8, estado: 'pendiente' },
  ],
};

const fmt = n => '$' + n.toLocaleString('es-CL');

const MENUS = {
  gerencia: [
    { key: 'cobranzas', label: 'Cobranzas', icon: '💰' },
    { key: 'margen', label: 'Margen ventas', icon: '📊' },
    { key: 'cantidades', label: 'Cantidades', icon: '📦' },
    { key: 'formas', label: 'Forma de pago', icon: '💳' },
    { key: 'clientes', label: 'Clientes', icon: '👥' },
    { key: 'cargo', label: 'Cargo Tracking', icon: '🚢' },
  ],
  vendedor: [
    { key: 'stock', label: 'Stock disponible', icon: '📦' },
    { key: 'historial', label: 'Historial clientes', icon: '📋' },
    { key: 'nuevo', label: 'Cliente nuevo', icon: '➕' },
    { key: 'email', label: 'Envío a Paula', icon: '✉️' },
  ],
};

let currentProfile = null;
let currentSection = null;

function init() {
  const el = document.getElementById('profiles');
  el.innerHTML = PROFILES.map(p => `
    <button class="profile-card" onclick="login('${p.id}')">
      <div class="avatar ${p.role === 'gerencia' ? 'ger' : 'ven'}">${p.icon}</div>
      <h3>${p.name}</h3>
      <p>${p.role === 'gerencia' ? 'Gerencia' : 'Vendedor'}</p>
    </button>
  `).join('');
}

function login(id) {
  currentProfile = PROFILES.find(p => p.id === id);
  document.getElementById('login').style.display = 'none';
  const app = document.getElementById('app');
  app.classList.add('active');
  document.getElementById('topTitle').textContent = currentProfile.name;
  document.getElementById('roleBadge').textContent = currentProfile.role;
  buildSidebar();
  navigate(MENUS[currentProfile.role][0].key);
}

function logout() {
  document.getElementById('login').style.display = '';
  document.getElementById('app').classList.remove('active');
  currentProfile = null;
}

function buildSidebar() {
  const menu = MENUS[currentProfile.role];
  document.getElementById('sidebar').innerHTML = menu.map(m => `
    <button onclick="navigate('${m.key}')" data-key="${m.key}">
      <span style="font-size:1.1rem">${m.icon}</span> <span>${m.label}</span>
    </button>
  `).join('');
}

function navigate(key) {
  currentSection = key;
  document.querySelectorAll('.sidebar button').forEach(b => b.classList.toggle('active', b.dataset.key === key));
  const c = document.getElementById('content');
  const views = { cobranzas, margen, cantidades, formas, clientes, stock, historial, nuevo, email, cargo };
  c.innerHTML = views[key] ? views[key]() : '';
}

// GERENCIA VIEWS
function cobranzas() {
  const total = MOCK.cobranzas.reduce((s, r) => s + r.monto, 0);
  const vencido = MOCK.cobranzas.filter(r => r.estado === 'vencido').reduce((s, r) => s + r.monto, 0);
  const pendiente = MOCK.cobranzas.filter(r => r.estado === 'pendiente').reduce((s, r) => s + r.monto, 0);
  return `<h3>Cobranzas</h3>
    <div class="stat-grid">
      <div class="stat"><div class="label">Total</div><div class="val">${fmt(total)}</div></div>
      <div class="stat"><div class="label">Vencido</div><div class="val status-vencido">${fmt(vencido)}</div></div>
      <div class="stat"><div class="label">Pendiente</div><div class="val status-pendiente">${fmt(pendiente)}</div></div>
    </div>
    <div class="tbl-wrap"><table>
      <tr><th>Cliente</th><th>Monto</th><th>Vencimiento</th><th>Estado</th></tr>
      ${MOCK.cobranzas.map(r => `<tr>
        <td>${r.cliente}</td><td>${fmt(r.monto)}</td><td>${r.vencimiento}</td>
        <td class="status-${r.estado}">${r.estado}</td>
      </tr>`).join('')}
    </table></div>`;
}

function margen() {
  return `<h3>Margen de ventas por vendedor</h3>
    <div class="tbl-wrap"><table>
      <tr><th>Vendedor</th><th>Ventas</th><th>Costo</th><th>Margen</th><th>%</th></tr>
      ${MOCK.ventas.map(r => {
        const m = r.ventas - r.costo;
        const pct = ((m / r.ventas) * 100).toFixed(1);
        return `<tr><td>${r.vendedor}</td><td>${fmt(r.ventas)}</td><td>${fmt(r.costo)}</td><td>${fmt(m)}</td><td>${pct}%</td></tr>`;
      }).join('')}
    </table></div>
    <div class="stat-grid">
      ${MOCK.ventas.map(r => {
        const m = r.ventas - r.costo;
        const pct = ((m / r.ventas) * 100).toFixed(1);
        const w = Math.round((m / r.ventas) * 100);
        return `<div class="stat"><div class="label">${r.vendedor}</div><div class="val">${pct}%</div>
          <div style="margin-top:.5rem;height:6px;background:var(--surface2);border-radius:3px">
            <div style="width:${w}%;height:100%;background:var(--accent);border-radius:3px"></div>
          </div></div>`;
      }).join('')}
    </div>`;
}

function cantidades() {
  return `<h3>Cantidades vendidas</h3>
    <div class="tbl-wrap"><table>
      <tr><th>Producto</th><th>Vendido</th><th>Stock</th><th>% vendido</th></tr>
      ${MOCK.cantidades.map(r => {
        const pct = ((r.vendido / (r.vendido + r.stock)) * 100).toFixed(1);
        return `<tr><td>${r.producto}</td><td>${r.vendido.toLocaleString('es-CL')}</td><td>${r.stock.toLocaleString('es-CL')}</td><td>${pct}%</td></tr>`;
      }).join('')}
    </table></div>`;
}

function formas() {
  return `<h3>Forma de pago</h3>
    <div class="stat-grid">
      ${MOCK.formasPago.map(r => `<div class="stat">
        <div class="label">${r.forma}</div><div class="val">${fmt(r.monto)}</div>
        <div style="margin-top:.5rem;font-size:.8rem;color:var(--text2)">${r.pct}% del total</div>
        <div style="margin-top:.35rem;height:6px;background:var(--surface2);border-radius:3px">
          <div style="width:${r.pct}%;height:100%;background:var(--accent2);border-radius:3px"></div>
        </div>
      </div>`).join('')}
    </div>`;
}

function clientes() {
  return `<h3>Clientes</h3>
    <div class="stat-grid">
      <div class="stat"><div class="label">Total clientes</div><div class="val">${MOCK.clientes.length}</div></div>
    </div>
    <div class="tbl-wrap"><table>
      <tr><th>Nombre</th><th>RUT</th><th>Vendedor</th><th>Última compra</th></tr>
      ${MOCK.clientes.map(r => `<tr><td>${r.nombre}</td><td>${r.rut}</td><td>${r.vendedor}</td><td>${r.ultimaCompra}</td></tr>`).join('')}
    </table></div>`;
}

// VENDEDOR VIEWS
function stock() {
  return `<h3>Stock disponible</h3>
    <div class="tbl-wrap"><table>
      <tr><th>Código</th><th>Producto</th><th>Disponible</th><th>Reservado</th><th>Ubicación</th></tr>
      ${MOCK.stock.map(r => `<tr>
        <td style="font-family:monospace">${r.codigo}</td><td>${r.producto}</td>
        <td>${r.disponible.toLocaleString('es-CL')}</td><td>${r.reservado.toLocaleString('es-CL')}</td>
        <td>${r.ubicacion}</td>
      </tr>`).join('')}
    </table></div>`;
}

function historial() {
  return `<h3>Historial de clientes</h3>
    <div class="tbl-wrap"><table>
      <tr><th>Cliente</th><th>Fecha</th><th>Total</th><th>Productos</th><th>Estado</th></tr>
      ${MOCK.historial.map(r => `<tr>
        <td>${r.cliente}</td><td>${r.fecha}</td><td>${fmt(r.total)}</td>
        <td>${r.productos}</td><td class="status-${r.estado === 'entregado' ? 'pagado' : 'pendiente'}">${r.estado}</td>
      </tr>`).join('')}
    </table></div>`;
}

function nuevo() {
  return `<h3>Nuevo cliente</h3>
    <div class="form-grid">
      <div><label>Nombre / Razón social</label><input placeholder="Ej: Aceros del Sur SpA"></div>
      <div><label>RUT</label><input placeholder="76.123.456-7"></div>
      <div><label>Contacto</label><input placeholder="Nombre del contacto"></div>
      <div><label>Teléfono</label><input type="tel" placeholder="+56 9 1234 5678"></div>
      <div><label>Email</label><input type="email" placeholder="contacto@empresa.cl"></div>
      <div><label>Dirección</label><input placeholder="Calle 123, Ciudad"></div>
      <div class="full"><label>Notas</label><input placeholder="Observaciones opcionales"></div>
      <div class="full"><button class="btn-save" onclick="alert('Cliente guardado (demo)')">Guardar cliente</button></div>
    </div>`;
}

function email() {
  return `<h3>Envío automático a Paula</h3>
    <div class="email-card">
      <h4>✉️ Componer correo</h4>
      <label>Para</label>
      <input value="paula@grantt.cl" readonly style="opacity:.7">
      <label>Asunto</label>
      <input id="emailSubject" placeholder="Ej: Resumen semanal clientes">
      <label>Mensaje</label>
      <textarea id="emailBody" placeholder="Escribe tu mensaje..."></textarea>
      <button class="btn-send" onclick="sendEmail()">Enviar a Paula</button>
    </div>`;
}

const ESTADO_LBL = { en_origen: 'En Origen', en_transito: 'En Tránsito', en_bodega: 'En Bodega' };
const ESTADO_CLS = { en_origen: 'status-pendiente', en_transito: 'status-pendiente', en_bodega: 'status-pagado' };
function fmtDateCargo(iso) { if (!iso) return '—'; const [y,m,d] = iso.split('-'); return d+'/'+m+'/'+y; }

function cargo() {
  loadCargo();
  return '<h3>🚢 Cargo Tracking</h3><div id="cargoContent" style="color:var(--text2)">Cargando embarques…</div>';
}

async function loadCargo() {
  const { data, error } = await sbEmbarques.from('embarques').select('*').order('created_at', { ascending: false });
  const el = document.getElementById('cargoContent');
  if (!el) return;
  if (error) { el.innerHTML = '<p style="color:var(--danger)">Error: ' + error.message + '</p>'; return; }
  if (!data || data.length === 0) { el.innerHTML = '<p>No hay embarques registrados.</p>'; return; }
  const origen = data.filter(e => e.estado_embarque === 'en_origen').length;
  const transito = data.filter(e => e.estado_embarque === 'en_transito').length;
  const bodega = data.filter(e => e.estado_embarque === 'en_bodega').length;
  el.innerHTML = `
    <div class="stat-grid">
      <div class="stat"><div class="label">Total</div><div class="val">${data.length}</div></div>
      <div class="stat"><div class="label">En origen</div><div class="val status-pendiente">${origen}</div></div>
      <div class="stat"><div class="label">En tránsito</div><div class="val status-pendiente">${transito}</div></div>
      <div class="stat"><div class="label">En bodega</div><div class="val status-pagado">${bodega}</div></div>
    </div>
    <div class="tbl-wrap"><table>
      <tr><th>Estado</th><th>Invoice</th><th>Descripción</th><th>Transporte</th><th>ETD</th><th>ETA</th><th>BL/AWB</th><th>Unidades</th><th>Cert.</th></tr>
      ${data.map(e => `<tr>
        <td class="${ESTADO_CLS[e.estado_embarque] || ''}">${ESTADO_LBL[e.estado_embarque] || e.estado_embarque}</td>
        <td>${e.invoice || '—'}</td>
        <td>${e.descripcion || '—'}</td>
        <td>${e.tipo_transporte === 'aereo' ? 'Aéreo' : e.tipo_transporte === 'maritimo' ? 'Marítimo' : '—'}</td>
        <td>${fmtDateCargo(e.etd)}</td>
        <td>${fmtDateCargo(e.eta)}</td>
        <td>${e.bl_awb || '—'}</td>
        <td>${e.unidades != null ? e.unidades.toLocaleString('es-CL') : '—'}${e.cajas != null ? ' (' + e.cajas.toLocaleString('es-CL') + ' cajas)' : ''}</td>
        <td>${e.certificable === 'si' ? 'Sí' : e.certificable === 'no' ? 'No' : '—'}</td>
      </tr>`).join('')}
    </table></div>`;
}

function sendEmail() {
  const s = document.getElementById('emailSubject').value || 'Sin asunto';
  const b = document.getElementById('emailBody').value || '';
  window.open('mailto:paula@grantt.cl?subject=' + encodeURIComponent(s) + '&body=' + encodeURIComponent(b));
}

init();
</script>
