<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Ventas 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10;
    --surface: #111318;
    --surface2: #181b22;
    --border: #222530;
    --accent: #00e5ff;
    --accent2: #ff3d6b;
    --accent3: #ffe000;
    --text: #e8eaf0;
    --muted: #6b7280;
    --positive: #00c48c;
    --negative: #ff3d6b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    padding: 2rem 3rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
    background: linear-gradient(135deg, #0a0c10 60%, #0d1520);
  }
  .header-left h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.5rem, 5vw, 4.5rem);
    letter-spacing: 0.04em;
    line-height: 1;
    color: #fff;
  }
  .header-left h1 span { color: var(--accent); }
  .header-left p { color: var(--muted); font-size: 0.85rem; margin-top: 0.4rem; }
  .year-badge {
    background: var(--accent);
    color: #000;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 0.1em;
    padding: 0.4rem 1.2rem;
    border-radius: 4px;
  }

  /* VENDEDOR TABS */
  .tabs {
    display: flex;
    gap: 0;
    padding: 1.5rem 3rem 0;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    padding: 0.75rem 2rem;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab[data-v="MARCELO"].active { color: var(--accent2); border-bottom-color: var(--accent2); }
  .tab[data-v="JOEL"].active { color: var(--accent3); border-bottom-color: var(--accent3); }

  /* MAIN CONTENT */
  main { padding: 2rem 3rem; }

  /* KPI CARDS */
  .kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem;
    margin-bottom: 2rem;
  }
  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.25rem 1.5rem;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .kpi-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--kpi-color, var(--accent));
  }
  .kpi-card:hover { border-color: #333; }
  .kpi-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 0.5rem; }
  .kpi-value { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; letter-spacing: 0.02em; color: #fff; }
  .kpi-sub { font-size: 0.75rem; color: var(--muted); margin-top: 0.25rem; }
  .kpi-delta { font-size: 0.8rem; font-weight: 600; margin-top: 0.3rem; }
  .kpi-delta.pos { color: var(--positive); }
  .kpi-delta.neg { color: var(--negative); }

  /* MONTH SELECTOR */
  .controls {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }
  .controls label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .month-btns { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .month-btn {
    padding: 0.35rem 0.7rem;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 0.78rem;
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'DM Sans', sans-serif;
  }
  .month-btn:hover { border-color: #444; color: var(--text); }
  .month-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }

  /* TABLE */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 2rem;
  }
  .table-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
  }
  .table-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; letter-spacing: 0.06em; color: var(--text); }
  .view-toggle { display: flex; gap: 0.5rem; }
  .vt-btn {
    padding: 0.3rem 0.8rem;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 0.75rem;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.15s;
  }
  .vt-btn.active { background: var(--surface2); color: var(--text); border-color: #444; }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    padding: 0.7rem 1rem;
    text-align: right;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  thead th:first-child { text-align: left; }
  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  tbody tr:hover { background: var(--surface2); }
  tbody tr:last-child { border-bottom: none; }
  td {
    padding: 0.7rem 1rem;
    font-size: 0.85rem;
    text-align: right;
    white-space: nowrap;
  }
  td:first-child {
    text-align: left;
    font-weight: 500;
    color: var(--text);
  }
  .cell-pos { color: var(--positive); }
  .cell-neg { color: var(--negative); }
  .cell-zero { color: var(--muted); }
  .cell-pct { font-size: 0.78rem; }

  /* BAR CHART */
  .chart-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.5rem;
    margin-bottom: 2rem;
  }
  .chart-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; letter-spacing: 0.06em; margin-bottom: 1.5rem; }
  .bar-chart { display: flex; flex-direction: column; gap: 0.8rem; }
  .bar-row { display: flex; align-items: center; gap: 1rem; }
  .bar-label { width: 130px; font-size: 0.75rem; color: var(--muted); text-align: right; flex-shrink: 0; text-transform: uppercase; letter-spacing: 0.05em; }
  .bar-track { flex: 1; height: 24px; background: var(--surface2); border-radius: 3px; overflow: hidden; position: relative; }
  .bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.8s cubic-bezier(.4,0,.2,1);
    display: flex;
    align-items: center;
    padding-right: 8px;
    justify-content: flex-end;
    min-width: 2px;
  }
  .bar-fill span { font-size: 0.7rem; font-weight: 600; color: #000; white-space: nowrap; }
  .bar-val { width: 110px; font-size: 0.78rem; color: var(--muted); flex-shrink: 0; }

  /* FOOTER */
  footer {
    padding: 1.5rem 3rem;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  footer p { font-size: 0.75rem; color: var(--muted); }

  /* ANIMATIONS */
  @keyframes fadeIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: none; } }
  .kpi-card, .table-wrap, .chart-section { animation: fadeIn 0.4s ease both; }
  .kpi-card:nth-child(2) { animation-delay: 0.05s; }
  .kpi-card:nth-child(3) { animation-delay: 0.1s; }
  .kpi-card:nth-child(4) { animation-delay: 0.15s; }

  @media (max-width: 768px) {
    header, .tabs, main, footer { padding-left: 1.2rem; padding-right: 1.2rem; }
    .bar-label { width: 80px; font-size: 0.65rem; }
  }
</style>
</head>

function fmt(n) {
  if (n === 0) return '$-';
  return '$' + Math.abs(Math.round(n)).toLocaleString('es-CL');
}
function fmtSigned(n) {
  if (n === 0) return '-';
  const s = '$' + Math.abs(Math.round(n)).toLocaleString('es-CL');
  return n > 0 ? '+' + s : '-' + s;
}
function fmtPct(n) {
  if (n === 0) return '-';
  return (n > 0 ? '+' : '') + n.toFixed(1) + '%';
}
function colorClass(n) {
  if (n > 0) return 'cell-pos';
  if (n < 0) return 'cell-neg';
  return 'cell-zero';

  const kpis = [
    { label: 'Total Acum. 2026', value: fmt(tot26), sub: 'Meses con datos', delta: null },
    { label: MESES[mesIdx] + ' 2026', value: fmt(mes26), sub: 'Mes seleccionado', delta: null },
    { label: 'Var. vs ' + MESES[mesIdx] + ' 2025', value: fmtPct(pctMes), sub: fmtSigned(diffMes), delta: diffMes },
    { label: 'Top Categoría', value: bestCat || '-', sub: bestVal > 0 ? fmt(bestVal) : 'Sin ventas', delta: null },
  ];
  document.getElementById('kpis').innerHTML = kpis.map(k => `
    <div class="kpi-card" style="--kpi-color:${color}">
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-value">${k.value}</div>
      <div class="kpi-sub">${k.sub}</div>
      ${k.delta !== null ? `<div class="kpi-delta ${k.delta >= 0 ? 'pos' : 'neg'}">${k.delta >= 0 ? '▲' : '▼'} ${Math.abs(pctMes).toFixed(1)}% vs año anterior</div>` : ''}
    </div>
  `).join('');
}

function renderMonthBtns() {
  document.getElementById('monthBtns').innerHTML = MESES.map((m,i) =>
    `<button class="month-btn ${i === currentMonth ? 'active' : ''}" onclick="setMonth(${i})">${m.slice(0,3)}</button>`
  ).join('');
}

function renderTable() {
  const d = DATA[currentVendedor];
  const mi = currentMonth;
  document.getElementById('tableTitle').textContent =
    (currentView === 'valores' ? 'Ventas por Categoría — ' :
     currentView === 'variacion' ? 'Variación % por Categoría — ' :
     'Diferencia $ por Categoría — ') + MESES[mi];

  let html = '<table><thead><tr><th>Categoría</th><th>2026</th><th>2025</th>';
  if (currentView === 'valores') html += '<th>Diferencia</th></tr></thead><tbody>';
  else if (currentView === 'variacion') html += '<th>Variación %</th></tr></thead><tbody>';
  else html += '<th>Δ</th></tr></thead><tbody>';

  CATS.forEach(c => {
    const v26 = d.v2026[c][mi];
    const v25 = d.v2025[c][mi];
    const diff = v26 - v25;
    const pct = v25 !== 0 ? ((v26 - v25) / Math.abs(v25)) * 100 : 0;
    if (v26 === 0 && v25 === 0) return;

    if (currentView === 'valores') {
      html += `<tr>
        <td>${c}</td>
        <td>${fmt(v26)}</td>
        <td class="cell-zero">${fmt(v25)}</td>
        <td class="${colorClass(diff)}">${fmtSigned(diff)}</td>
      </tr>`;
    } else if (currentView === 'variacion') {
      html += `<tr>
        <td>${c}</td>
        <td>${fmt(v26)}</td>
        <td class="cell-zero">${fmt(v25)}</td>
        <td class="${colorClass(pct)} cell-pct">${fmtPct(pct)}</td>
      </tr>`;
    } else {
      html += `<tr>
        <td>${c}</td>
        <td>${fmt(v26)}</td>
        <td class="cell-zero">${fmt(v25)}</td>
        <td class="${colorClass(diff)}">${fmtSigned(diff)}</td>
      </tr>`;
    }
  });
  html += '</tbody></table>';
  document.getElementById('tableContainer').innerHTML = html;
}

function renderChart() {
  const d = DATA[currentVendedor];
  const mi = currentMonth;
  const color = COLORS[currentVendedor];
  document.getElementById('chartTitle').textContent = 'Ventas 2026 — ' + MESES[mi];

  const rows = CATS.map(c => ({ cat: c, val: d.v2026[c][mi] }))
    .filter(r => r.val > 0)
    .sort((a,b) => b.val - a.val);

  if (rows.length === 0) {
    document.getElementById('barChart').innerHTML = '<p style="color:var(--muted);font-size:.85rem;padding:1rem 0">Sin datos para este mes</p>';
    return;
  }
  const max = rows[0].val;
  document.getElementById('barChart').innerHTML = rows.map(r => {
    const pct = (r.val / max * 100).toFixed(1);
    return `<div class="bar-row">
      <div class="bar-label">${r.cat}</div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${pct}%;background:${color}">
          <span>${pct > 15 ? fmt(r.val) : ''}</span>
        </div>
      </div>
      <div class="bar-val">${pct <= 15 ? fmt(r.val) : ''}</div>
    </div>`;
  }).join('');
}

// ── ACTIONS ──────────────────────────────────────────────────────────────────
function setVendedor(v, el) {
  currentVendedor = v;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderAll();
}
function setMonth(i) {
  currentMonth = i;
  renderAll();
}
function setView(v, el) {
  currentView = v;
  document.querySelectorAll('.vt-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderTable();
}

// ── INIT ─────────────────────────────────────────────────────────────────────
renderAll();
</script>
</body>
</html>
